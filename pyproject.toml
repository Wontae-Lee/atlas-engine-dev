[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

# The distribution name is `atlas-engine` (`atlas` is taken on PyPI); the imported
# package stays `atlas`, with backend-specific extensions selected by atlas._core.
[project]
name = "atlas-engine"
version = "0.1.0"
description = "Atlas Engine — GPU/CPU rarefied-gas (DSMC) particle simulation (nanobind bindings)"
requires-python = ">=3.8"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Wontae Lee" }]
keywords = ["dsmc", "rarefied-gas", "particle-simulation", "cfd", "cuda", "tbb", "nanobind"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

# numpy is the array interchange for Fluid.positions()/velocities()/species()
# and Fluid.from_arrays(). The extension imports without it, but those calls need it.
dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/wontae-lee/atlas-engine-dev"
Repository = "https://github.com/wontae-lee/atlas-engine-dev"
Documentation = "https://github.com/wontae-lee/atlas-engine-dev/blob/main/docs/guidelines/python.md"
Issues = "https://github.com/wontae-lee/atlas-engine-dev/issues"

[tool.scikit-build]
# Drive the repository's top-level CMakeLists.txt.
cmake.version = ">=3.20"
ninja.version = ">=1.10"

# Wheel build config: bindings on, tests/benchmarks off. The parallel backend
# (TBB / CUDA) is chosen per build via
#   -C cmake.define.ATLAS_DEVICE_SYSTEM=CUDA
# defaulting to the portable CPU (TBB) backend here.
cmake.define.ATLAS_PYTHON = "ON"
cmake.define.ATLAS_GOOGLE_TEST = "OFF"
cmake.define.ATLAS_BENCHMARKS = "OFF"
cmake.define.ATLAS_EXAMPLES = "OFF"
cmake.define.ATLAS_INTERACTIVE = "OFF"
cmake.define.ATLAS_INTERACTIVE_RENDERING = "OFF"
cmake.define.ATLAS_HOST_COMPILER = "native"
cmake.define.ATLAS_DEVICE_SYSTEM = "TBB"
cmake.define.CMAKE_BUILD_TYPE = "Release"

# Build the compiled extension and install it alongside the Python package.
build.targets = ["atlas_python"]
install.components = ["python"]
wheel.packages = ["bindings/python/atlas"]
wheel.exclude = ["atlas/CMakeLists.txt", "atlas/**/*.cpp", "atlas/**/*.h"]
wheel.license-files = [
    "LICENSE",
    "external/nanobind/LICENSE",
    "external/nanobind/ext/robin_map/LICENSE",
    "external/tinyobj/LICENSE",
    "external/protobuf/LICENSE",
    "external/json/LICENSE.MIT",
]
sdist.include = [
    "CMakeLists.txt", "CMakePresets.json", "cmake/**", "include/**", "src/**",
    "bindings/**",
    "external/nanobind/**", "external/tinyobj/**", "external/protobuf/**",
    "external/json/**",
    "external/googletest/**", "external/googlebenchmark/**",
    "examples/**", "benchmarks/CMakeLists.txt", "tests/**", "scripts/**",
    "LICENSE", "README.md", "CITATION.cff", "docs/guidelines/python.md",
    "!**/.git", "!**/.git/**", "!**/__pycache__/**",
]
sdist.exclude = [
    ".git/**", "**/.git", "**/.git/**", ".idea/**", ".github/**",
    "build/**", "dist/**", "cmake-build-*/**", "**/__pycache__/**",
]

# Keep build trees separate per interpreter/ABI so cibuildwheel's back-to-back
# Python versions never reuse a stale CMake cache. scripts/build_wheels.sh
# overrides this per backend.
build-dir = "build/wheel/{cache_tag}"

# ============================================================
# cibuildwheel: build redistributable manylinux wheels across CPython versions.
#
# Atlas needs oneTBB >= 2021, which the manylinux base images do not ship (EPEL's
# tbb is far too old), so we build it from source once per image in before-all.
# The wheel is the portable CPU (TBB) backend; the CUDA backend is not published
# here (it needs the host NVIDIA driver at run time).
# ============================================================
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
build-frontend = "build"
test-command = [
    "python -c \"import atlas; from importlib.metadata import version; assert atlas.__version__ == version('atlas-engine')\"",
    "python -c \"from atlas.math import Bool3, Float3, Quaternion, dot; assert Bool3(True, False, True).any(); v = Float3(1, 2, 3); assert dot(v, v) == 14; assert Quaternion().rotate(v) == v\"",
]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
# oneTBB 2021.x from source into /usr/local (libtbb.so.12 + TBBConfig.cmake), so
# find_package(TBB) resolves it and auditwheel bundles it into the wheel.
before-all = [
    "dnf install -y git cmake gcc-c++ ninja-build",
    "git clone --depth 1 --branch v2021.11.0 https://github.com/oneapi-src/oneTBB /tmp/onetbb",
    "cmake -S /tmp/onetbb -B /tmp/onetbb/build -G Ninja -DTBB_TEST=OFF -DTBB_STRICT=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local",
    "cmake --build /tmp/onetbb/build --target install",
]
environment = { CMAKE_PREFIX_PATH = "/usr/local", LD_LIBRARY_PATH = "/usr/local/lib64:/usr/local/lib", CMAKE_BUILD_PARALLEL_LEVEL = "2" }
