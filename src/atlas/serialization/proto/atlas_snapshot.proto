syntax = "proto3";

package atlas.proto;

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message RawBuffer {
  uint64 element_count = 1;
  bytes data = 2;
}

// One entry of a MaterialDictionary, indexed by species id. A solid carries
// only mass; the remaining fields read back as one, so they round-trip.
message Material {
  int32 type = 1;
  double mass = 2;
  double translational_energy = 3;
  double rotational_energy = 4;
  double vibrational_energy = 5;
  double reference_diameter = 6;
  double reference_temperature = 7;
  double viscosity_index = 8;
  double scattering_parameter = 9;
}

enum ScalarType {
  SCALAR_FLOAT32 = 0;
  SCALAR_FLOAT64 = 1;
}

message FluidSnapshot {
  uint32 version = 1;
  ScalarType scalar_type = 2;
  uint64 buffer_size = 3;
  uint64 particle_count = 4;
  double statistical_weight = 5;
  // 6 was the MaterialProperty table, 7 the generator operators. Generators
  // are no longer owned by the fluid.
  reserved 6, 7;
  RawBuffer positions = 8;
  RawBuffer velocities = 9;
  RawBuffer species = 10;
  RawBuffer active = 11;
  RawBuffer temperature = 12;
  bool includes_temperature_state = 13;
  repeated Material materials = 14;
  RawBuffer translational_energy = 15;
  bool includes_translational_energy_state = 16;
  RawBuffer rotational_energy = 17;
  bool includes_rotational_energy_state = 18;
  RawBuffer vibrational_energy = 19;
  bool includes_vibrational_energy_state = 20;
}

enum UniverseStateKind {
  UNIVERSE_TEMPERATURE = 0;
  UNIVERSE_BULK_VELOCITY = 1;
  UNIVERSE_FIELD_FORCE = 2;
  UNIVERSE_MAX_RELATIVE_SPEED = 3;
  UNIVERSE_THERMAL_ENERGY = 4;
  UNIVERSE_NUMBER_PARTICLE = 5;
  UNIVERSE_COLLISION_COUNT = 6;
  UNIVERSE_KNUDSEN_NUMBER = 7;
  UNIVERSE_MAX_SIGMA_G = 8;
  UNIVERSE_ALLOCATED_SOLVER = 9;
  UNIVERSE_GRAVITY = 10;
}

message UniverseState {
  UniverseStateKind kind = 1;
  RawBuffer scalar_buffer = 2;
  RawBuffer vector_buffer = 3;
  RawBuffer int_buffer = 4;
}

message UniverseSnapshot {
  uint32 version = 1;
  ScalarType scalar_type = 2;
  Vector3 lower_corner = 3;
  Vector3 upper_corner = 4;
  double cell_size = 5;
  repeated UniverseState states = 6;
}
