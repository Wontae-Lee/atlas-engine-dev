name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python / Ubuntu ${{ matrix.ubuntu }} / TBB Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    env:
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
      ATLAS_DEV_IMAGE: atlas:ci-tbb
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build standard development image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tbb-dev
          load: true
          tags: atlas:ci-tbb
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            BUILD_JOBS=2
          cache-from: type=gha,scope=dev-tbb-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=dev-tbb-${{ matrix.ubuntu }},ignore-error=true
      - uses: actions/cache@v4
        with:
          path: build/docker-tbb-ubuntu${{ matrix.ubuntu }}/ccache
          key: python-ccache-${{ matrix.ubuntu }}-${{ hashFiles('Dockerfile', 'docker/**', 'cmake/dependencies/**') }}-${{ github.sha }}
          restore-keys: |
            python-ccache-${{ matrix.ubuntu }}-${{ hashFiles('Dockerfile', 'docker/**', 'cmake/dependencies/**') }}-
      - name: Build and validate source distribution and wheel
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          python3 scripts/dev.py tbb python scripts/check_python_package.py 2>&1 | tee logs/python.log
      - uses: actions/upload-artifact@v4
        with:
          name: python-ubuntu${{ matrix.ubuntu }}-tbb
          path: |
            dist/python-validation/source/*.tar.gz
            dist/python-validation/wheels/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-logs-ubuntu${{ matrix.ubuntu }}-tbb
          path: logs/
          if-no-files-found: warn
