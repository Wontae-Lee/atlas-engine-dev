name: Publish Python

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated distributions to PyPI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sdist:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build --sdist --outdir dist
      - run: python -m twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    needs: build-sdist
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist
      - name: Extract source distribution
        run: |
          mkdir package-source
          tar -xzf dist/*.tar.gz -C package-source --strip-components=1
      - name: Build and test TBB wheels from source distribution
        uses: pypa/cibuildwheel@v2.21
        with:
          package-dir: package-source
          output-dir: wheelhouse
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install twine
      - run: python -m twine check --strict wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    needs: [build-sdist, build-wheels]
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/atlas-engine
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
