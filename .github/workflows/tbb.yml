name: TBB CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tbb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: C++ / ${{ matrix.os }} / TBB
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      CC: gcc
      CXX: g++
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libtbb-dev ninja-build
      - name: Configure TBB tests
        run: >-
          cmake -S . -B build/ci-tbb -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DATLAS_DEVICE_SYSTEM=TBB
          -DATLAS_HOST_COMPILER=native
          -DBUILD_TESTING=ON
          -DATLAS_GOOGLE_TEST=ON
          -DATLAS_PYTHON=OFF
          -DATLAS_BENCHMARKS=OFF
          -DATLAS_EXAMPLES=OFF
      - name: Build C++ tests
        run: cmake --build build/ci-tbb --target atlas_tests
      - name: Run C++ tests
        run: >-
          ctest --test-dir build/ci-tbb --output-on-failure
          --no-tests=error --parallel 2 -R '^atlas_tests\.'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tbb-test-logs-${{ matrix.os }}
          path: build/ci-tbb/Testing/Temporary/
