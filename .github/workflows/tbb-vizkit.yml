name: TBB Vizkit

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tbb-vizkit-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu TBB Debug Vizkit Build
            os: ubuntu-24.04
            configure_preset: tbb-debug
            build_preset: build-tbb-debug
          - name: Ubuntu TBB Release Vizkit Build
            os: ubuntu-24.04
            configure_preset: tbb-release
            build_preset: build-tbb-release
          - name: macOS TBB Debug Vizkit Build
            os: macos-14
            configure_preset: tbb-debug
            build_preset: build-tbb-debug
          - name: macOS TBB Release Vizkit Build
            os: macos-14
            configure_preset: tbb-release
            build_preset: build-tbb-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == "Linux"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libtbb-dev \
            libglfw3-dev \
            libglew-dev \
            libglu1-mesa-dev \
            freeglut3-dev

      - name: Install dependencies (macOS)
        if: runner.os == "macOS"
        run: |
          brew update
          brew install ninja tbb glfw glew freeglut

      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }}
