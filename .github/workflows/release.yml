name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z); the vX.Y.Z tag must already exist
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version and tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Match version, project metadata, and existing tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from scripts.bump_version import SEMANTIC_VERSION, read_versions

          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Release must be dispatched from main")
          version = os.environ["RELEASE_VERSION"]
          if SEMANTIC_VERSION.fullmatch(version) is None:
              raise SystemExit(f"Release version must be X.Y.Z, got {version!r}")
          tag = f"v{version}"
          versions = read_versions()
          versions["release input"] = version
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Release versions do not match: {versions}")
          subprocess.run(
              ["git", "fetch", "--no-tags", "origin", f"refs/tags/{tag}:refs/tags/{tag}"],
              check=True,
          )
          tag_commit = subprocess.check_output(
              ["git", "rev-list", "-n", "1", tag], text=True
          ).strip()
          if tag_commit != os.environ["GITHUB_SHA"]:
              raise SystemExit(f"{tag} does not point to the dispatched main commit")
          print(f"Validated Atlas {version} at {tag_commit}")
          PY

  build-python:
    needs: verify-version
    uses: ./.github/workflows/publish-python.yml
    permissions:
      contents: read

  publish-pypi:
    needs: build-python
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/atlas-engine
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-docker:
    needs: verify-version
    uses: ./.github/workflows/publish-docker.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write

  github-release:
    name: Create GitHub Release
    needs: [publish-pypi, publish-docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release for existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: >-
          gh release create "${RELEASE_TAG}"
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "${RELEASE_TAG}"
