name: Publish Docker

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit to build for a release
        required: false
        type: string
      publish:
        description: Publish the checked images to GHCR
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked images to GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.engine }} / Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        engine: [tbb, cuda]
        ubuntu: ['22.04', '24.04']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare image tags
        id: image
        env:
          ATLAS_ENGINE: ${{ matrix.engine }}
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          image = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
          engine = os.environ["ATLAS_ENGINE"]
          ubuntu = os.environ["UBUNTU_VERSION"]
          target = engine
          suffix = f"{engine}-ubuntu{ubuntu}"
          commit_tag = f"{suffix}-sha-{os.environ['SOURCE_SHA']}"
          tags = [commit_tag, f"{version}-{suffix}", suffix]
          if ubuntu == "22.04":
              tags.append(engine)
          if not all(re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", tag) for tag in tags):
              raise ValueError("The package version must produce valid Docker tags")
          references = [f"{image}:{tag}" for tag in tags]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"target={target}", file=output)
              print(f"reference={references[0]}", file=output)
              print("tags<<IMAGE_TAGS", *references, "IMAGE_TAGS", sep="\n", file=output)
          PY
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ steps.image.outputs.target }}
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            BUILD_JOBS=2
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_ref || github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=docker-${{ matrix.engine }}-ubuntu${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.engine }}-ubuntu${{ matrix.ubuntu }},ignore-error=true
      - name: Check installed Atlas runtime
        env:
          TEST_IMAGE: ${{ steps.image.outputs.reference }}
          EXPECTED_ENGINE: ${{ matrix.engine }}
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
        run: |
          docker run --rm "$TEST_IMAGE" python -m pip check
          docker run --rm -i -e EXPECTED_ENGINE -e EXPECTED_VERSION "$TEST_IMAGE" python - <<'PY'
          import os
          from importlib.metadata import version

          import numpy as np
          import atlas
          from atlas import _core, Bool3, Float3
          from atlas.math import dot

          expected = os.environ["EXPECTED_ENGINE"]
          assert atlas.available_engines() == (expected,)
          assert atlas.get_default_engine() == _core.engine == expected
          assert atlas.__version__ == version("atlas-engine") == os.environ["EXPECTED_VERSION"]
          assert Bool3(True, False, True).any()
          vector = Float3(1.0, 2.0, 3.0)
          assert dot(vector, vector) == 14.0
          print(f"Atlas {atlas.__version__}: {expected}; NumPy {np.__version__}")
          PY
      - name: Run TBB simulation example
        if: matrix.engine == 'tbb'
        env:
          TEST_IMAGE: ${{ steps.image.outputs.reference }}
        run: >-
          timeout 60s docker run --rm "$TEST_IMAGE"
          python -X faulthandler /opt/atlas/examples/python/main.py
      - name: Check native executables
        env:
          TEST_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          docker run --rm "$TEST_IMAGE" sh -c \
            'for executable in atlas-interactive atlas-interactive-example; do path="$(command -v "$executable")" && ! ldd "$path" | grep "not found" || exit 1; done'
      - name: Log in to GHCR
        if: >-
          inputs.publish &&
          ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked image
        if: >-
          inputs.publish &&
          ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Record image references
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          PUBLISH: ${{ inputs.publish && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
        run: |
          python - <<'PY'
          import os

          status = "Published" if os.environ["PUBLISH"] == "true" else "Built and checked; not published"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print(status, "\n", file=summary)
              for tag in os.environ["IMAGE_TAGS"].splitlines():
                  print(f"- {tag}", file=summary)
          PY
