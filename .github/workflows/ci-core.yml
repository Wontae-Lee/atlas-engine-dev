name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core / Ubuntu ${{ matrix.ubuntu }} / TBB Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    env:
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
      ATLAS_DEV_IMAGE: atlas:ci-tbb
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build standard development image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tbb-dev
          load: true
          tags: atlas:ci-tbb
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            BUILD_JOBS=2
          cache-from: type=gha,scope=dev-tbb-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=dev-tbb-${{ matrix.ubuntu }},ignore-error=true
      - uses: actions/cache@v4
        with:
          path: build/docker-tbb-ubuntu${{ matrix.ubuntu }}/ccache
          key: core-ccache-${{ matrix.ubuntu }}-${{ hashFiles('Dockerfile', 'docker/**', 'cmake/dependencies/**') }}-${{ github.sha }}
          restore-keys: |
            core-ccache-${{ matrix.ubuntu }}-${{ hashFiles('Dockerfile', 'docker/**', 'cmake/dependencies/**') }}-
      - name: Configure all native test suites
        run: python3 scripts/dev.py tbb cmake --preset tbb-test
      - name: Build tests and native applications
        run: python3 scripts/dev.py tbb cmake --build --preset tbb-test
      - name: Run Core and Interactive tests
        run: python3 scripts/dev.py tbb ctest --preset tbb-test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-logs-ubuntu${{ matrix.ubuntu }}
          path: build/docker-tbb-ubuntu${{ matrix.ubuntu }}/build/tbb-test/Testing/Temporary/
